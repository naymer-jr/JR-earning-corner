<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JR Earning Corner</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#111827,#2563eb);
  color:white;
  padding:18px 20px;
  position:sticky;
  top:0;
  z-index:10;
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.nav button{
  border:0;
  background:white;
  color:#2563eb;
  padding:10px 16px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 15px;
}

.hero{
  background:linear-gradient(135deg,#111827,#2563eb);
  color:white;
  padding:50px 25px;
  border-radius:22px;
  text-align:center;
  margin-bottom:22px;
}

.hero h1{
  font-size:38px;
  margin-bottom:12px;
}

.hero p{
  font-size:17px;
}

.card{
  background:white;
  padding:25px;
  margin:18px 0;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h2{
  color:#2563eb;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:15px;
}

.box{
  background:#f8fafc;
  padding:20px;
  border-radius:15px;
}

.box h3{
  margin-bottom:8px;
}

.balance{
  background:linear-gradient(135deg,#2563eb,#1e40af);
  color:white;
  padding:25px;
  border-radius:18px;
}

.balance h2{
  color:white;
}

.amount{
  font-size:34px;
  font-weight:bold;
  margin-top:10px;
}

.btn{
  border:0;
  display:inline-block;
  margin-top:15px;
  padding:12px 20px;
  background:#2563eb;
  color:white;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #d1d5db;
  border-radius:9px;
  outline:none;
}

.notice{
  background:#eff6ff;
  border-left:5px solid #2563eb;
  padding:15px;
  margin-top:15px;
  border-radius:8px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-box{
  background:white;
  width:100%;
  max-width:420px;
  padding:25px;
  border-radius:18px;
}

.close{
  float:right;
  cursor:pointer;
  font-size:22px;
}

#userArea{
  display:none;
}

footer{
  background:#111827;
  color:white;
  text-align:center;
  padding:30px 15px;
  margin-top:30px;
}

footer p{
  margin:7px;
}

@media(max-width:600px){
  .hero h1{
    font-size:30px;
  }

  .amount{
    font-size:28px;
  }
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">JR Earning Corner</div>

<div>

<button id="loginBtn" onclick="openLogin()">
Login / Register
</button>

<button id="logoutBtn"
onclick="logout()"
style="display:none;">
Logout
</button>

</div>

</div>
</header>


<div class="container">

<section class="hero">

<h1>JR Earning Corner</h1>

<p>
অনলাইন কাজ ও বৈধ ডিজিটাল সেবার তথ্য
</p>

<button class="btn"
onclick="openLogin()">
শুরু করুন
</button>

</section>


<div class="card">

<h2>স্বাগতম 👋</h2>

<p>
JR Earning Corner-এ আপনাকে স্বাগতম।
এখানে অনলাইন কাজ, ডিজিটাল সেবা এবং প্রয়োজনীয়
তথ্য সহজভাবে দেওয়া
